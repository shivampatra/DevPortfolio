<!-- templates/components/projects.html -->
<section id="projects" class="projects-section py-5" aria-labelledby="projects-title">
    <div class="container">
        <h2 id="projects-title" class="section-title text-center mb-4">Projects</h2>

        <!-- Filled in by projects.js from the tags below. Stays hidden without JS. -->
        <div class="project-filters" role="group" aria-label="Filter projects by technology" hidden></div>
        <p class="project-status" role="status"></p>

        <div class="row g-4 projects-grid">
            {% for project in projects %}
            <div class="col-md-6 col-lg-4 project-item">
                <article class="card project-card h-100">
                    <div class="project-image-container">
                        {% if project.image %}
                        <img src="{{ project.image }}" class="card-img-top project-image"
                             alt="{{ project.title }}" loading="lazy" decoding="async">
                        {% endif %}
                    </div>

                    <div class="card-body">
                        <h3 class="card-title project-title">{{ project.title }}</h3>
                        <p class="card-text project-description">{{ project.description }}</p>

                        {% if project.tags %}
                        <ul class="project-tags">
                            {% for tag in project.tags %}
                            <li><span class="badge">{{ tag }}</span></li>
                            {% endfor %}
                        </ul>
                        {% endif %}

                        <div class="project-footer">
                            <a href="{{ project.link }}" class="project-link stretched-link">
                                <span class="project-link-text">View details<span class="visually-hidden"> of {{ project.title }}</span></span>
                                <span class="project-link-icon" aria-hidden="true">
                                    <svg viewBox="0 0 16 16"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg>
                                    <svg viewBox="0 0 16 16"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg>
                                </span>
                            </a>
                        </div>
                    </div>
                </article>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
