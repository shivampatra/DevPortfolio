<!-- templates/components/contact.html -->
<section id="contact" class="contact-section py-5">
    <div class="container">
        <h2 class="section-title text-center mb-5">Get In Touch</h2>
        
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="contact-info glass-card">
                    <h3 class="mb-4">Contact Information</h3>
                    
                    <div class="contact-item mb-3">
                        <i class="fas fa-map-marker-alt contact-icon"></i>
                        <div>
                            <h5>Location</h5>
                            <p>Bhubaneswar, Odisha, India</p>
                        </div>
                    </div>
                    
                    <div class="contact-item mb-3">
                        <i class="fas fa-envelope contact-icon"></i>
                        <div>
                            <h5>Email</h5>
                            <p>shivampatra@yahoo.com</p>
                        </div>
                    </div>
                    
                    <div class="contact-item mb-3">
                        <i class="fas fa-phone contact-icon"></i>
                        <div>
                            <h5>Phone</h5>
                            <p>+91 **********</p>
                        </div>
                    </div>
                    
                    <div class="social-links mt-4">
                        <a href="https://shivamportfolio.pythonanywhere.com/" class="social-link" aria-label="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="https://www.linkedin.com/in/shivam-patra/" class="social-link" aria-label="LinkedIn">
                            <i class="fab fa-linkedin"></i>
                        </a>
                        <a href="https://shivamportfolio.pythonanywhere.com/" class="social-link" aria-label="Twitter">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="https://www.instagram.com/shivam__official_____/" class="social-link" aria-label="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-7">
                <div class="contact-form glass-card">
                    <h3 class="mb-4">Send a Message</h3>
                    
                    <form action="{{ url_for('contact') }}" method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="name" name="name" placeholder="Your Name" required>
                                    <label for="name">Your Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="email" name="email" placeholder="Your Email" required>
                                    <label for="email">Your Email</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="subject" name="subject" placeholder="Subject" required>
                                    <label for="subject">Subject</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating mb-3">
                                    <textarea class="form-control" id="message" name="message" placeholder="Your Message" style="height: 150px" required></textarea>
                                    <label for="message">Your Message</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
